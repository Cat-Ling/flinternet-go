name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -count=1 -race -coverprofile=coverage.out ./...

      - name: Verify frontend script syntax
        run: node --check web/static/app.js

      - name: Smoke cross-compile check
        run: |
          for pair in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64 openbsd/amd64 netbsd/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            echo "Building ${os}/${arch}..."
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -o /dev/null ./cmd/flinternet
          done

  docker-check:
    name: Docker & Compose Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.build.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flinternet:ci
          build-args: |
            VERSION=${{ github.sha }}

      - name: Smoke test container
        run: |
          cid=$(docker run -d -p 18080:8080 -e FLINTERNET_LOG_LEVEL=debug flinternet:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health | grep -q '"status":"ok"'; then
              echo "Container healthcheck passed"
              exit 0
            fi
            sleep 0.5
          done
          docker logs "$cid"
          exit 1
